// Configuración Gradle para la generación del paquete APK en terminales móviles/POS Android
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abcsoftware.billing'
    compileSdk 34

    defaultConfig {
        applicationId "com.abcsoftware.billing"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
}
