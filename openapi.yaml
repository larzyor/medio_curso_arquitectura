openapi: 3.0.3
info:
  title: ABC Billing – API de facturación electrónica (UBL 2.1 / SUNAT)
  version: 1.0.0
  description: 'Contrato de la API del sistema de ABC Software Corp. Generada en la fase Spec-First.


    Cada operación declara `x-implementation`: `implemented` (existe en el código C# de este repositorio) o `contract` (contrato definido, implementación
    pendiente).

    `x-sunat` indica el método del servicio web de SUNAT que respalda la operación (Manual del Programador).


    Notas: los códigos de catálogo viajan como string. **Catálogo 05** = tipos de tributo (1000, 2000, 7152…); **Catálogo 08** = únicamente sistema
    de cálculo del ISC.'
servers:
- url: http://localhost:5099
  description: Desarrollo local
tags:
- name: Comprobantes
- name: Notas
- name: Resúmenes
- name: Migración
- name: Catálogos
paths:
  /api/v1/invoices:
    post:
      tags:
      - Comprobantes
      summary: Emitir factura o boleta
      description: 'Caso de uso EmitirFactura: asigna serie y correlativo (atómico, nunca los envía el cliente), calcula ISC → IGV → ICBPER, genera
        el XML UBL 2.1, lo firma (XMLDSig), lo valida contra UBL-Invoice-2.1.xsd y lo guarda en estado Firmado. No contacta a SUNAT: eso lo hace
        /transmit.'
      operationId: emitirComprobante
      security:
      - bearerAuth: []
      x-implementation: implemented
      x-sunat: (previo a sendBill)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Comprobante creado y firmado.
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      tags:
      - Comprobantes
      summary: Listar comprobantes
      description: Filtra por serie, estado y rango de fechas de emisión.
      operationId: listarComprobantes
      security:
      - bearerAuth: []
      x-implementation: implemented
      parameters:
      - name: serie
        in: query
        schema:
          type: string
          pattern: ^[FB][A-Z0-9]{3}$
      - name: estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoComprobante'
      - name: desde
        in: query
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Lista de comprobantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/invoices/{id}:
    get:
      tags:
      - Comprobantes
      summary: Obtener un comprobante
      description: Devuelve totales, tributos por Catálogo 05, ítems y el CDR si ya fue enviado.
      operationId: obtenerComprobante
      security:
      - bearerAuth: []
      x-implementation: implemented
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Comprobante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/invoices/{id}/xml:
    get:
      tags:
      - Comprobantes
      summary: Descargar el XML UBL 2.1 firmado
      description: 'XML tal como se envía a SUNAT: ISO-8859-1, firma XMLDSig en ext:ExtensionContent. Nombre sugerido RUC-TT-SERIE-CORRELATIVO.xml.'
      operationId: descargarXml
      security:
      - bearerAuth: []
      x-implementation: implemented
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: XML firmado.
          content:
            application/xml:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/invoices/{id}/transmit:
    post:
      tags:
      - Comprobantes
      summary: Enviar a SUNAT/OSE (sendBill, síncrono)
      description: 'Empaqueta el XML en un ZIP (carpeta dummy + XML), lo envía por SOAP con WS-Security UsernameToken y guarda el CDR. 200 = SUNAT
        respondió (aceptado, aceptado con observaciones o rechazado). 202 = SUNAT/OSE no disponible: queda EnContingencia para reintento. 409
        si ya fue aceptado o si fue rechazado (su numeración queda consumida: emitir uno nuevo, Manual 4.1). 502 si SUNAT devuelve un SOAP Fault.'
      operationId: transmitirComprobante
      security:
      - bearerAuth: []
      x-implementation: implemented
      x-sunat: sendBill
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Resultado con el CDR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransmisionResponse'
        '202':
          description: SUNAT no disponible; el comprobante quedó en contingencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransmisionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v1/invoices/{id}/cdr:
    get:
      tags:
      - Comprobantes
      summary: Descargar la Constancia de Recepción (CDR)
      description: ZIP con R-<nombre del archivo enviado>.xml, firmado por SUNAT. Equivale a getStatusCdr.
      operationId: descargarCdr
      security:
      - bearerAuth: []
      x-implementation: implemented
      x-sunat: getStatusCdr
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ZIP del CDR.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/credit-notes:
    post:
      tags:
      - Notas
      summary: Emitir nota de crédito (tipo 07)
      description: Referencia un comprobante afectado (cac:BillingReference) y un motivo del Catálogo 09. La serie empieza con F si afecta a una
        factura y con B si afecta a una boleta.
      operationId: emitirNotaCredito
      security:
      - bearerAuth: []
      x-implementation: contract
      x-sunat: sendBill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Nota creada y firmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/debit-notes:
    post:
      tags:
      - Notas
      summary: Emitir nota de débito (tipo 08)
      description: Motivo del Catálogo 10 (intereses por mora, aumento en el valor, penalidades).
      operationId: emitirNotaDebito
      security:
      - bearerAuth: []
      x-implementation: contract
      x-sunat: sendBill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Nota creada y firmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/voided-documents:
    post:
      tags:
      - Resúmenes
      summary: Comunicación de baja (RA)
      description: 'Da de baja comprobantes ya aceptados. Envío asíncrono: devuelve un ticket. Archivo RUC-RA-YYYYMMDD-CCCCC.'
      operationId: comunicarBaja
      security:
      - bearerAuth: []
      x-implementation: contract
      x-sunat: sendSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidedDocumentsRequest'
      responses:
        '202':
          description: Recibido; consultar el ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/daily-summaries:
    post:
      tags:
      - Resúmenes
      summary: Resumen diario de boletas (RC)
      description: 'Las boletas se informan por resumen diario, en bloques de hasta 500 líneas (cada bloque con su correlativo). Asíncrono: devuelve
        un ticket.'
      operationId: enviarResumenDiario
      security:
      - bearerAuth: []
      x-implementation: contract
      x-sunat: sendSummary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailySummaryRequest'
      responses:
        '202':
          description: Recibido; consultar el ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/tickets/{ticket}:
    get:
      tags:
      - Resúmenes
      summary: Consultar el estado de un ticket
      description: 'statusCode: 0 procesó correctamente, 98 en proceso, 99 proceso con errores. Con 0 o 99 incluye el CDR.'
      operationId: consultarTicket
      security:
      - bearerAuth: []
      x-implementation: contract
      x-sunat: getStatus
      parameters:
      - name: ticket
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10,20}$
      responses:
        '200':
          description: Estado del ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/migration/legacy-stock:
    post:
      tags:
      - Migración
      summary: Migrar el stock del software básico al kardex
      description: 'Recibe los 5 campos legados (fecha, ingreso, salida, producto, nro_documento). Crea un movimiento SALDO_INICIAL_MIGRACION
        por producto (formato 12.1: la primera tupla es el saldo inicial) y conserva cada fila original en una tabla de auditoría enlazada al
        kardex. No factura los movimientos históricos. Requiere rol admin.'
      operationId: migrarStockLegado
      security:
      - bearerAuth: []
      x-implementation: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrateLegacyRequest'
      responses:
        '200':
          description: Informe de migración (migrados, errores por fila, saldos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /api/v1/catalogs/{catalogo}:
    get:
      tags:
      - Catálogos
      summary: Consultar un catálogo SUNAT
      description: Valores vigentes de los catálogos 01, 02, 03, 05, 06, 07, 08, 09, 10, 16 y 51 para poblar las pantallas del cliente.
      operationId: consultarCatalogo
      security:
      - bearerAuth: []
      x-implementation: contract
      parameters:
      - name: catalogo
        in: path
        required: true
        schema:
          type: string
          enum:
          - '01'
          - '02'
          - '03'
          - '05'
          - '06'
          - '07'
          - 08
          - 09
          - '10'
          - '16'
          - '51'
      responses:
        '200':
          description: Valores del catálogo.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Token Bearer. Roles: `emisor` (comprobantes) y `admin` (migración). En producción: JWT (OAuth2/OIDC).'
  responses:
    BadRequest:
      description: 400 – JSON mal formado o campos obligatorios/rangos incumplidos (validación del modelo).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: 401 – Falta el token Bearer o es inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: 403 – El token no tiene el rol requerido (emisor / admin).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: 404 – El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: 409 – Estado incompatible (ya aceptado, rechazado o sin XML firmado).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unprocessable:
      description: 422 – Regla de negocio o de catálogo incumplida (RUC inválido, código fuera de catálogo, XML que no cumple el XSD...).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    BadGateway:
      description: '502 – SUNAT respondió con un SOAP Fault (excepción: el documento queda como no informado).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: 503 – SUNAT/OSE no disponible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    EstadoComprobante:
      type: string
      enum:
      - Pendiente
      - Firmado
      - EnContingencia
      - Aceptado
      - AceptadoConObservaciones
      - Rechazado
    ProblemDetails:
      type: object
      description: RFC 7807
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errores:
          description: Presente en 422 de XSD (lista) y 502 (código SUNAT).
          oneOf:
          - type: array
            items:
              type: string
          - type: object
    ClienteDto:
      type: object
      required:
      - tipoDocumento
      - numeroDocumento
      - razonSocial
      properties:
        tipoDocumento:
          type: string
          enum:
          - '0'
          - '1'
          - '4'
          - '6'
          - '7'
          description: 'Catálogo 06: 0 sin RUC no domiciliado, 1 DNI, 4 CE, 6 RUC, 7 pasaporte.'
        numeroDocumento:
          type: string
          maxLength: 15
        razonSocial:
          type: string
          maxLength: 250
        direccion:
          type: string
          maxLength: 250
    ItemDto:
      type: object
      required:
      - descripcion
      - unidadMedida
      - cantidad
      - valorUnitario
      - afectacionIgv
      properties:
        codigoProducto:
          type: string
          maxLength: 30
        descripcion:
          type: string
          maxLength: 250
        unidadMedida:
          type: string
          enum:
          - NIU
          - ZZ
          - KGM
          - GRM
          - LTR
          - MTR
          - BX
          - BG
          - BO
          - CT
          - CA
          - SET
          - KT
          - LBR
          - KTM
          - MLL
          - UM
          - BJ
          - CJ
          - CY
          description: Catálogo 03 (UN/ECE Rec. 20).
        cantidad:
          type: number
          minimum: 0
          exclusiveMinimum: true
        valorUnitario:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Sin impuestos. En gratuitas, valor referencial.
        afectacionIgv:
          type: string
          enum:
          - '10'
          - '11'
          - '12'
          - '13'
          - '14'
          - '15'
          - '16'
          - '20'
          - '21'
          - '30'
          - '31'
          - '32'
          - '33'
          - '34'
          - '35'
          - '36'
          - '40'
          description: Catálogo 07 (el 17, IVAP, no está soportado en esta fase).
        sistemaIsc:
          type: string
          enum:
          - '01'
          - '02'
          - '03'
          description: Catálogo 08 (únicamente sistema de cálculo del ISC). El 03 no está soportado en esta fase.
        tasaIsc:
          type: number
          minimum: 0
          description: '% para el sistema al valor.'
        montoFijoIsc:
          type: number
          minimum: 0
        aplicaIcbper:
          type: boolean
          description: Bolsa de plástico afecta al ICBPER (Catálogo 05, 7152). La cantidad debe ser entera.
    CreateInvoiceRequest:
      type: object
      required:
      - tipoComprobante
      - cliente
      - items
      properties:
        tipoComprobante:
          type: string
          enum:
          - '01'
          - '03'
          description: Catálogo 01.
        tipoOperacion:
          type: string
          default: '0101'
          enum:
          - '0101'
          - '0102'
          - '0103'
          - '0104'
          - '0105'
          - '0106'
          - '0107'
          - 0108
          - '0110'
          - '0111'
          description: Catálogo 51 (cbc:ProfileID).
        serie:
          type: string
          pattern: ^[FB][A-Z0-9]{3}$
          description: Opcional. El correlativo siempre lo asigna el servidor.
        moneda:
          type: string
          enum:
          - PEN
          - USD
          - EUR
          default: PEN
        cliente:
          $ref: '#/components/schemas/ClienteDto'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemDto'
      example:
        tipoComprobante: '01'
        tipoOperacion: '0101'
        moneda: PEN
        cliente:
          tipoDocumento: '6'
          numeroDocumento: '20123456786'
          razonSocial: BODEGA EL ÑANDÚ S.A.C.
        items:
        - codigoProducto: ARR-5KG
          descripcion: Arroz extra 5 kg
          unidadMedida: NIU
          cantidad: 10
          valorUnitario: 18.0
          afectacionIgv: '10'
        - codigoProducto: CER-620
          descripcion: Cerveza 620 ml
          unidadMedida: NIU
          cantidad: 6
          valorUnitario: 5.0
          afectacionIgv: '10'
          sistemaIsc: '01'
          tasaIsc: 10
        - codigoProducto: BOL-PLA
          descripcion: Bolsa de plástico
          unidadMedida: NIU
          cantidad: 3
          valorUnitario: 0.1
          afectacionIgv: '10'
          aplicaIcbper: true
    TributoResponse:
      type: object
      properties:
        codigo:
          type: string
          enum:
          - '1000'
          - '1016'
          - '2000'
          - '7152'
          - '9995'
          - '9996'
          - '9997'
          - '9998'
          - '9999'
          description: Catálogo 05.
        nombre:
          type: string
          example: IGV
        codigoInternacional:
          type: string
          example: VAT
        baseImponible:
          type: number
          nullable: true
        monto:
          type: number
    ItemResponse:
      type: object
      properties:
        numero:
          type: integer
        descripcion:
          type: string
        unidadMedida:
          type: string
        cantidad:
          type: number
        valorUnitario:
          type: number
        afectacionIgv:
          type: string
        valorVenta:
          type: number
        isc:
          type: number
        igv:
          type: number
        icbper:
          type: number
        precioUnitarioConImpuestos:
          type: number
    TotalesResponse:
      type: object
      properties:
        gravadas:
          type: number
        exoneradas:
          type: number
        inafectas:
          type: number
        exportacion:
          type: number
        gratuitas:
          type: number
        baseImponibleIgv:
          type: number
        igv:
          type: number
        isc:
          type: number
        icbper:
          type: number
        valorVenta:
          type: number
        precioVenta:
          type: number
        importeTotal:
          type: number
    CdrResponse:
      type: object
      properties:
        codigo:
          type: string
          description: 0 = aceptado; 2000-3999 rechazo.
        descripcion:
          type: string
        observaciones:
          type: array
          items:
            type: string
          description: 'Códigos 4000+ (ej.: 4031 - Debe indicar el nombre comercial).'
    InvoiceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tipoComprobante:
          type: string
        serieNumero:
          type: string
          example: F001-1
        nombreArchivo:
          type: string
          example: 20600000013-01-F001-1
        fechaEmision:
          type: string
          format: date-time
        moneda:
          type: string
        clienteDocumento:
          type: string
          example: 6-20123456786
        clienteRazonSocial:
          type: string
        totales:
          $ref: '#/components/schemas/TotalesResponse'
        tributos:
          type: array
          items:
            $ref: '#/components/schemas/TributoResponse'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        estado:
          $ref: '#/components/schemas/EstadoComprobante'
        digestValue:
          type: string
          nullable: true
        cdr:
          allOf:
          - $ref: '#/components/schemas/CdrResponse'
          nullable: true
    TransmisionResponse:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/EstadoComprobante'
        codigoRespuesta:
          type: integer
          nullable: true
        descripcion:
          type: string
        observaciones:
          type: array
          items:
            type: string
    CreateNoteRequest:
      type: object
      required:
      - documentoAfectado
      - codigoMotivo
      - descripcionMotivo
      - items
      properties:
        documentoAfectado:
          type: object
          required:
          - tipoComprobante
          - serieNumero
          properties:
            tipoComprobante:
              type: string
              enum:
              - '01'
              - '03'
            serieNumero:
              type: string
              example: F001-1
        codigoMotivo:
          type: string
          description: Catálogo 09 (01–10) en notas de crédito; Catálogo 10 (01–03) en notas de débito.
        descripcionMotivo:
          type: string
          maxLength: 250
        serie:
          type: string
          pattern: ^[FB][A-Z0-9]{3}$
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemDto'
    VoidedDocumentsRequest:
      type: object
      required:
      - fechaEmision
      - documentos
      properties:
        fechaEmision:
          type: string
          format: date
        documentos:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - tipoComprobante
            - serieNumero
            - motivo
            properties:
              tipoComprobante:
                type: string
                enum:
                - '01'
                - '07'
                - 08
              serieNumero:
                type: string
              motivo:
                type: string
                maxLength: 100
    DailySummaryRequest:
      type: object
      required:
      - fechaEmision
      - comprobantes
      properties:
        fechaEmision:
          type: string
          format: date
          description: Fecha de emisión de las boletas y notas vinculadas.
        comprobantes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            example: B001-1
    TicketResponse:
      type: object
      properties:
        ticket:
          type: string
          example: '201100000011227'
        nombreArchivo:
          type: string
    TicketStatusResponse:
      type: object
      properties:
        statusCode:
          type: string
          enum:
          - '0'
          - '98'
          - '99'
          description: 0 procesó correctamente, 98 en proceso, 99 proceso con errores.
        cdr:
          allOf:
          - $ref: '#/components/schemas/CdrResponse'
          nullable: true
    LegacyMovement:
      type: object
      required:
      - fecha
      - producto
      properties:
        fecha:
          type: string
          example: 01/03/2024
          description: dd/MM/yyyy o yyyy-MM-dd.
        ingreso:
          type: number
          minimum: 0
        salida:
          type: number
          minimum: 0
        producto:
          type: string
        nroDocumento:
          type: string
          description: Número de documento interno, conservado en la auditoría.
    MigrateLegacyRequest:
      type: object
      required:
      - registros
      properties:
        registros:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/LegacyMovement'
    MigrationResult:
      type: object
      properties:
        totalRegistros:
          type: integer
        registrosMigrados:
          type: integer
        registrosConError:
          type: integer
        saldos:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              producto:
                type: string
              saldo:
                type: number
        errores:
          type: array
          items:
            type: object
            properties:
              fila:
                type: integer
              mensaje:
                type: string
    CatalogItem:
      type: object
      properties:
        codigo:
          type: string
        descripcion:
          type: string
